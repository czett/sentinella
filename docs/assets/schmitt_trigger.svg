<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Dual-threshold hysteresis</title>
  <desc id="desc">The signal turns on when state of charge reaches the high trigger of 90 percent. It turns off when state of charge falls to the low reset of 35 percent. Between both thresholds the previous state is held, so the signal cannot bounce.</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#183adb"/>
    </marker>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#0a0a0c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e1261c"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#f8f8f9"/>
  <rect x="48" y="40" width="10" height="10" fill="#e1261c"/>

  <!-- Deadband between reset and trigger. -->
  <rect x="360" y="116" width="440" height="214" fill="#183adb" opacity="0.07"/>
  <line x1="360" y1="116" x2="360" y2="330" stroke="#0a0a0c" stroke-width="1" stroke-dasharray="4 5" opacity="0.3"/>
  <line x1="800" y1="116" x2="800" y2="330" stroke="#0a0a0c" stroke-width="1" stroke-dasharray="4 5" opacity="0.3"/>

  <!-- State rails and threshold transitions. -->
  <path d="M80 270H800" fill="none" stroke="#0a0a0c" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <path d="M800 150H360" fill="none" stroke="#183adb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M800 270V150" fill="none" stroke="#e1261c" stroke-width="2" marker-end="url(#arrow-red)"/>
  <path d="M360 150V270" fill="none" stroke="#e1261c" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Axis. -->
  <line x1="80" y1="330" x2="880" y2="330" stroke="#0a0a0c" stroke-width="1.5"/>
  <g stroke="#0a0a0c" stroke-width="1" opacity="0.45">
    <line x1="80" y1="330" x2="80" y2="338"/>
    <line x1="280" y1="330" x2="280" y2="338"/>
    <line x1="480" y1="330" x2="480" y2="338"/>
    <line x1="680" y1="330" x2="680" y2="338"/>
    <line x1="880" y1="330" x2="880" y2="338"/>
  </g>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums lining-nums">
    <text x="80" y="356" fill="#71717a" font-size="10" text-anchor="middle">0</text>
    <text x="280" y="356" fill="#71717a" font-size="10" text-anchor="middle">25</text>
    <text x="480" y="356" fill="#71717a" font-size="10" text-anchor="middle">50</text>
    <text x="680" y="356" fill="#71717a" font-size="10" text-anchor="middle">75</text>
    <text x="880" y="356" fill="#71717a" font-size="10" text-anchor="middle">100</text>
    <text x="880" y="382" fill="#71717a" font-size="10" letter-spacing="1.1" text-anchor="end">SOC %</text>

    <text x="800" y="94" fill="#e1261c" font-size="12" font-weight="700" letter-spacing="1.4" text-anchor="middle">TRIGGER · 90%</text>
    <text x="360" y="370" fill="#e1261c" font-size="12" font-weight="700" letter-spacing="1.4" text-anchor="middle">RESET · 35%</text>

    <text x="580" y="207" fill="#183adb" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">DEADBAND</text>
    <text x="580" y="228" fill="#52525b" font-size="12" text-anchor="middle">state holds</text>

    <text x="788" y="136" fill="#183adb" font-size="12" font-weight="700" letter-spacing="1.4" text-anchor="end">TRUE</text>
    <text x="92" y="294" fill="#0a0a0c" font-size="12" font-weight="700" letter-spacing="1.4">FALSE</text>
  </g>
</svg>
